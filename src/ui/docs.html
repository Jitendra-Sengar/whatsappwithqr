<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sengar Infotech API Documentation</title>
    <link rel="icon" href="/media/favicon.png" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
    <link href="/main.css" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-gray-50 text-gray-900 font-sans">
    <header class="flex flex-col sm:flex-row justify-between items-center p-6 bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
      <div class="flex flex-col sm:flex-row items-center gap-4 text-center sm:text-left">
        <img
          src="/media/favicon.png"
          width="46"
          height="46"
          alt="Sengar Infotech logo"
          class="w-12 h-12 object-contain"
          loading="lazy"
        />
        <div>
          <div class="text-xl font-semibold text-gray-800">Sengar Infotech API Documentation</div>
          <div class="text-sm text-gray-500 mt-1">
            Signed in as <strong id="docsUsername">—</strong> (<span
              id="docsRole"
              >user</span
            >)
          </div>
        </div>
      </div>
      <button id="docsLogout" type="button" class="mt-4 sm:mt-0 bg-red-600 text-white py-2 px-6 rounded-full font-semibold shadow-md hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-colors">Logout</button>
    </header>
    <main class="container mx-auto p-6 flex flex-col gap-8">
      <p id="docsStatus" class="bg-blue-50 text-blue-700 p-4 rounded-lg border border-blue-200 shadow-sm">Loading session...</p>
      <p id="swaggerAuthState" class="hidden text-sm p-3 rounded-lg border" role="status"></p>
      <section id="swagger-ui" aria-live="polite" class="bg-white rounded-xl p-6 border border-gray-200 shadow-lg"></section>
      <section id="warest-code-table" class="hidden bg-white rounded-xl p-6 border border-gray-200 shadow-lg">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Sengar Infotech Code Reference</h2>
        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-sm min-w-[640px]">
            <thead>
              <tr>
                <th class="text-left uppercase text-xs text-gray-500 bg-gray-100 p-3 border-b border-gray-200">Code</th>
                <th class="text-left uppercase text-xs text-gray-500 bg-gray-100 p-3 border-b border-gray-200">Name</th>
                <th class="text-left uppercase text-xs text-gray-500 bg-gray-100 p-3 border-b border-gray-200">Description</th>
                <th class="text-left uppercase text-xs text-gray-500 bg-gray-100 p-3 border-b border-gray-200">HTTP</th>
                <th class="text-left uppercase text-xs text-gray-500 bg-gray-100 p-3 border-b border-gray-200">Category</th>
              </tr>
            </thead>
            <tbody id="codeTableBody">
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <footer class="site-footer px-6 pb-12">
      <div class="container mx-auto border-t border-gray-200 pt-4 text-gray-500 text-sm text-center font-semibold">
        <div>Copyright &copy; <span id="docsYear"></span> Sengar Infotech</div>
      </div>
    </footer>
    <script src="/auth.js" defer></script>
    <script
      src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"
      defer
    ></script>
    <script src="/docs.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var yearEl = document.getElementById("docsYear");
        if (yearEl) {
          yearEl.textContent = new Date().getFullYear();
        }
      });
    </script>
  </body>
</html>
