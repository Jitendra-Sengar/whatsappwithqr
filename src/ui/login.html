<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sengar Infotech Login</title>
    <link rel="icon" href="/media/favicon.png" />
    <link href="/main.css" rel="stylesheet">
  </head>
  <body class="min-h-screen flex items-center justify-center p-6 text-gray-50 bg-gray-950">
    <main class="w-full max-w-md">
      <section class="bg-gray-800 bg-opacity-90 backdrop-blur-md rounded-xl shadow-2xl border border-gray-700 p-8">
        <img
          src="/media/warest-logo.png"
          alt="Sengar Infotech Logo"
          class="block mx-auto mb-6 w-16 h-16 rounded-lg border border-gray-600 object-cover"
          width="64"
          height="64"
        />
        <div class="text-center mb-8">
          <h1 id="login-title" class="text-3xl font-bold tracking-tight text-white mb-2">Sign in to Sengar Infotech</h1>
          <p class="text-gray-400">Manage your WhatsApp API sessions</p>
        </div>

        <form id="loginForm" novalidate class="flex flex-col gap-4">
          <div class="flex flex-col gap-2">
            <label for="loginUsername" class="block text-sm font-medium text-gray-300">Username</label>
            <input
              id="loginUsername"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="Enter your username"
              required
              class="w-full px-4 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
            />
          </div>

          <div class="flex flex-col gap-2">
            <label for="loginPassword" class="block text-sm font-medium text-gray-300">Password</label>
            <div class="relative flex items-center">
              <input
                id="loginPassword"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
                class="w-full px-4 py-2 rounded-lg border border-gray-700 bg-gray-900 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-10"
              />
              <button
                id="togglePassword"
                type="button"
                aria-label="Show password"
                title="Show password"
                class="absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-full text-gray-400 hover:bg-gray-700 hover:text-white transition-colors"
              >
                <svg
                  class="icon-eye icon-eye-open w-5 h-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M2.458 12C3.732 7.943 7.522 5 13 5s9.268 2.943 10.542 7c-1.274 4.057-5.064 7-10.542 7S3.732 16.057 2.458 12z"
                  />
                  <circle cx="13" cy="12" r="3.2" />
                </svg>
                <svg
                  class="icon-eye icon-eye-closed hidden w-5 h-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M3 3l18 18M9.9 9.9a3 3 0 0 0 4.2 4.2M6.71 6.71C4.58 8.07 2.91 10.03 1.77 12c1.83 3.19 5.09 6 10.23 6 1.54 0 2.97-.27 4.26-.74M17.29 17.29C19.42 15.93 21.09 13.97 22.23 12c-1.83-3.19-5.09-6-10.23-6-1.11 0-2.18.15-3.19.42"
                  />
                </svg>
              </button>
            </div>
          </div>

          <!-- Honeypot anti-bot -->
          <input
            id="loginWebsite"
            type="text"
            class="sr-only"
            tabindex="-1"
            aria-hidden="true"
            autocomplete="off"
          />

          <div
            class="min-h-[1.5rem] text-sm text-red-400 mt-1"
            id="loginError"
            aria-live="polite"
            role="status"
          ></div>

          <button type="submit" id="loginSubmit" class="mt-4 w-full bg-blue-600 text-white py-2 px-4 rounded-full font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900 transition-colors">Sign in</button>
        </form>
      </section>
    </main>

    <script src="/auth.js"></script>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search || "");
        const nextRaw = params.get("next") || "/";
        const reason = params.get("reason") || "";
        const errBox = document.getElementById("loginError");

        const form = document.getElementById("loginForm");
        const btn = document.getElementById("loginSubmit");
        const usernameInput = document.getElementById("loginUsername");
        const passwordInput = document.getElementById("loginPassword");
        const honeypot = document.getElementById("loginWebsite");
        const togglePassword = document.getElementById("togglePassword");
        const AUTH = window.WAREST_AUTH || null;

        const setFieldErrorState = (hasError) => {
          if (!usernameInput || !passwordInput) return;
          [usernameInput, passwordInput].forEach((el) => {
            if (hasError) {
              el.classList.add("input-error");
              el.setAttribute("aria-invalid", "true");
            } else {
              el.classList.remove("input-error");
              el.removeAttribute("aria-invalid");
            }
          });
        };

        const showAutoRedirect = (msg) => {
          if (subtitle) {
            subtitle.textContent =
              msg || "Detecting existing Sengar Infotech session...";
          }
          if (btn) {
            btn.disabled = true;
            btn.textContent = "Checking session...";
          }
        };

        const attemptAutoLogin = async () => {
          try {
            if (!AUTH?.getSession) return false;
            const session = AUTH.getSession() || {};
            if (!session.apiKey) return false;
            showAutoRedirect(
              `Signed in as ${session.username || "user"} — redirecting...`
            );
            await Promise.resolve(
              AUTH.ensureDocsSession?.(session.apiKey)
            ).catch(() => {});
            redirectAfterLogin();
            return true;
          } catch {
            return false;
          }
        };

        if (AUTH) {
          attemptAutoLogin();
          AUTH.subscribe?.((event) => {
            if (event === "login") attemptAutoLogin();
          });
        }

        if (togglePassword && passwordInput) {
          let reveal = false;
          togglePassword.addEventListener("click", () => {
            reveal = !reveal;
            passwordInput.type = reveal ? "text" : "password";
            togglePassword.setAttribute(
              "aria-label",
              reveal ? "Hide password" : "Show password"
            );
            togglePassword.setAttribute(
              "title",
              reveal ? "Hide password" : "Show password"
            );
            const iconOpen = togglePassword.querySelector(".icon-eye-open");
            const iconClosed = togglePassword.querySelector(".icon-eye-closed");
            if (iconOpen && iconClosed) {
              iconOpen.classList.toggle("hidden", reveal);
              iconClosed.classList.toggle("hidden", !reveal);
            }
          });
        }

        try {
          const savedUser = localStorage.getItem("wa.username");
          if (savedUser && usernameInput) usernameInput.value = savedUser;
        } catch {}

        const buildTarget = () => {
          try {
            const nextUrl = new URL(nextRaw, window.location.origin);
            if (nextUrl.origin !== window.location.origin) return "/";
            return nextUrl.pathname + nextUrl.search + nextUrl.hash;
          } catch {
            return "/";
          }
        };

        const redirectAfterLogin = () => {
          window.location.replace(buildTarget());
        };

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (honeypot.value.trim()) return;

          const username = usernameInput.value.trim();
          const password = passwordInput.value;
          setFieldErrorState(false);

          if (!username || !password) {
            errBox.textContent = "Username and password are required.";
            errBox.classList.add("show");
            setFieldErrorState(true);
            return;
          }

          const defaultText = btn.textContent;
          btn.disabled = true;
          btn.textContent = "Signing in...";
          errBox.textContent = "";
          errBox.classList.remove("show");

          try {
            const resp = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
              credentials: "same-origin",
            });

            const data = await resp.json().catch(() => ({}));

            if (!resp.ok) {
              const retryAfter = data?.retryAfter;
              let message =
                data?.error || `Login failed (status ${resp.status})`;
              if (retryAfter) {
                message += ` — retry after ${retryAfter}s`;
              }
              throw new Error(message);
            }

            try {
              const auth = window.WAREST_AUTH;
              if (auth && typeof auth.setSession === "function") {
                auth.setSession(
                  {
                    apiKey: data.apiKey || "",
                    username: data.username || username,
                    baseUrl: window.location.origin,
                    isAdmin: !!data.isAdmin,
                  },
                  { broadcast: true, source: "login" }
                );
                auth.ensureDocsSession?.(data.apiKey || "");
              } else {
                localStorage.setItem("wa.apiKey", data.apiKey || "");
                localStorage.setItem("wa.username", data.username || username);
                localStorage.setItem("wa.baseUrl", window.location.origin);
                localStorage.setItem("wa.isAdmin", data.isAdmin ? "1" : "");
              }
            } catch {}

            redirectAfterLogin();
          } catch (err) {
            errBox.textContent = err?.message || "Login failed.";
            errBox.classList.add("show");
            setFieldErrorState(true);
          } finally {
            btn.disabled = false;
            btn.textContent = defaultText;
            if (passwordInput) passwordInput.value = "";
          }
        });
      })();
    </script>
  </body>
</html>
